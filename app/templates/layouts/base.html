<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="ClassroomLink - Interactive classroom screen sharing and laboratory streaming.">

    <title>
        {% block title %}ClassroomLink{% endblock %}
    </title>

    <link rel="stylesheet" href="{{ url_for('static', path='/css/output.css') }}">

    <script src="{{ url_for('static', path='/js/htmx.min.js') }}" defer></script>

    {% block head %}{% endblock %}
</head>

<body class="min-h-screen bg-base-200 text-base-content">

    {% block content %}{% endblock %}

    {% block scripts %}{% endblock %}

</body>

</html>
